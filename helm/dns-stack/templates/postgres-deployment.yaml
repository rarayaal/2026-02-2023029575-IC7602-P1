{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns-stack.fullname" . }}-database
  labels:
    app: database
    {{- include "dns-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.env.postgresPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app: database
    {{- include "dns-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.database.service.type }}
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: database
{{- end }}
