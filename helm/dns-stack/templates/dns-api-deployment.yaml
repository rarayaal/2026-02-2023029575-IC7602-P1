{{- if .Values.dnsApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns-stack.fullname" . }}-dns-api
  labels:
    app: dns-api
    {{- include "dns-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-api
  template:
    metadata:
      labels:
        app: dns-api
    spec:
      containers:
        - name: dns-api
          image: "{{ .Values.dnsApi.image.repository }}:{{ .Values.dnsApi.image.tag }}"
          imagePullPolicy: {{ .Values.dnsApi.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DNS_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: DNS_API_HOST
            - name: DNS_API_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: DNS_API_PORT
            - name: DNS_SERVER_IP
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: DNS_SERVER_IP
            - name: DNS_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: DNS_SERVER_PORT
            - name: DNS_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dns-stack.fullname" . }}-config
                  key: DNS_TIMEOUT_MS
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dns-api
  labels:
    app: dns-api
    {{- include "dns-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dnsApi.service.type }}
  ports:
    - port: {{ .Values.dnsApi.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: dns-api
{{- end }}
