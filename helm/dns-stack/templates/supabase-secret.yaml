{{- if .Values.supabase.create }}
# Credenciales de Supabase.
#
# Van en un Secret y no en el ConfigMap porque la llave service_role da acceso total a la base:
# en Kubernetes, un ConfigMap es para configuracion visible y un Secret para datos sensibles.
#
# Los valores no tienen valor por omision a proposito. Se pasan al instalar:
#
#   helm install dns-stack ./helm/dns-stack \
#     --set supabase.url=https://xxxxx.supabase.co \
#     --set supabase.serviceRoleKey=LA_LLAVE
#
# Si ya existe un Secret creado a mano, se puede reutilizar con:
#   --set supabase.create=false --set supabase.existingSecret=nombre-del-secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dns-stack.fullname" . }}-supabase
  labels:
    {{- include "dns-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  SUPABASE_URL: {{ required "Falta supabase.url: la direccion del proyecto de Supabase" .Values.supabase.url | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ required "Falta supabase.serviceRoleKey: la llave del proyecto de Supabase" .Values.supabase.serviceRoleKey | quote }}
{{- end }}
