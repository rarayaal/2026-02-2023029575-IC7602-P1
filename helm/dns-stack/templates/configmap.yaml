apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dns-stack.fullname" . }}-config
  labels:
    {{- include "dns-stack.labels" . | nindent 4 }}
data:
  SUPABASE_URL: {{ .Values.supabase.url | quote }}
  POSTGRES_DB: {{ .Values.database.env.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.database.env.postgresUser | quote }}
  DNS_API_HOST: {{ .Values.dnsApi.env.host | quote }}
  DNS_API_PORT: {{ .Values.dnsApi.env.port | quote }}
  DNS_API_MAX_THREADS: {{ .Values.dnsApi.env.maxThreads | quote }}
  DNS_SERVER_IP: {{ .Values.dnsApi.env.dnsServerIp | quote }}
  DNS_SERVER_PORT: {{ .Values.dnsApi.env.dnsServerPort | quote }}
  DNS_TIMEOUT_MS: {{ .Values.dnsApi.env.dnsTimeoutMs | quote }}
  INTERCEPTOR_BIND_ADDR: {{ .Values.dnsInterceptor.env.bindAddr | quote }}
  INTERCEPTOR_UDP_PORT: {{ .Values.dnsInterceptor.env.udpPort | quote }}
  DNS_API_URL: {{ .Values.dnsInterceptor.env.dnsApiUrl | quote }}
  VITE_API_URL: {{ .Values.dnsUi.env.apiUrl | quote }}
  SYNC_INTERVAL_SECONDS: {{ .Values.healthChecker.env.syncIntervalSeconds | quote }}
  MOCK_API_PORT: {{ .Values.mockDnsApi.env.port | quote }}
