# Valores por omisión para el Chart dns-stack (T-38 / T-39 - Rama Alexandra)

# Componente 1: Base de Datos PostgreSQL
database:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  env:
    postgresDb: dns_db
    postgresUser: postgres
    postgresPassword: postgrespassword

# Componente Auxiliar: PostgREST Engine
postgrest:
  enabled: true
  image:
    repository: postgrest/postgrest
    tag: v12.0.2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000

# Componente Auxiliar: Supabase REST Proxy
supabaseRest:
  enabled: true
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

# Componente 2: DNS API (Java Javalin backend real)
dnsApi:
  enabled: true
  image:
    repository: dns-api
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  env:
    host: "0.0.0.0"
    port: "8080"
    maxThreads: "100"
    dnsServerIp: "8.8.8.8"
    dnsServerPort: "53"
    dnsTimeoutMs: "3000"

# Componente 3: DNS Interceptor (Rust UDP)
dnsInterceptor:
  enabled: true
  image:
    repository: dns-interceptor
    tag: latest
    pullPolicy: Never
  service:
    type: NodePort
    dnsPort: 53
  env:
    bindAddr: "0.0.0.0"
    udpPort: "53"
    dnsApiUrl: "http://dns-api:8080"
    timeoutMs: "5000"

# Componente 4: DNS UI (React + Vite + Nginx)
dnsUi:
  enabled: true
  image:
    repository: dns-ui
    tag: latest
    pullPolicy: Never
  service:
    type: LoadBalancer
    port: 80
  env:
    apiUrl: ""

# Componente Auxiliar: Mock DNS API (Deshabilitado por defecto, superado por dns-api real)
mockDnsApi:
  enabled: false
  image:
    repository: mock-dns-api
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8081
  env:
    port: "8081"

# Componentes con dependencia externa:
# - healthChecker (Otto / T-32): Pendiente entrega de Dockerfile en C por parte del autor.
