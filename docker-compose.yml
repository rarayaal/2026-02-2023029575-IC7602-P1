# Orquestación del Stack DNS - T-38
#
# Levanta el sistema completo con un solo comando:
#
#   docker compose up -d --build
#
# Requisito previo: copiar dns-api/.env.example como dns-api/.env y completar las credenciales de
# Supabase. Ese archivo lo comparten el DNS API y los Health Checkers.
#
# Componentes:
# 1. dns-api            API REST en Java (Javalin), conectada a Supabase
# 2. dns-interceptor    Interceptor DNS sobre UDP, en Rust
# 3. checker-cr/us/eu   Health Checkers en GNU C, en tres ubicaciones simuladas
# 4. dns-ui             Interfaz web en React, servida por Nginx

services:
  # DNS API en Java (Javalin). Expone /api/exists, /api/records y /api/dns_resolver.
  dns-api:
    build:
      context: ./dns-api
      dockerfile: Dockerfile
    container_name: dns-api
    ports:
      - "8080:8080"
    # Las credenciales de Supabase se leen de dns-api/.env, que no se versiona.
    # Copiar dns-api/.env.example como dns-api/.env y completarlo antes de levantar el stack.
    env_file:
      - path: ./dns-api/.env
        required: false
    environment:
      DNS_API_HOST: "0.0.0.0"
      DNS_API_PORT: "8080"
      DNS_API_MAX_THREADS: "100"
      # Servidor DNS remoto al que se delegan los paquetes no estandar.
      DNS_SERVER_IP: "8.8.8.8"
      DNS_SERVER_PORT: "53"
      DNS_TIMEOUT_MS: "3000"
    healthcheck:
      # wget viene incluido en la imagen base alpine, no hay que instalar nada.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Servidor Interceptador DNS UDP/TCP en Rust
  dns-interceptor:
    build:
      context: ./dns-interceptor
      dockerfile: Dockerfile
    container_name: dns-interceptor
    command: ./dns-interceptor
    ports:
      - "53:53/udp"

    environment:
      INTERCEPTOR_BIND_ADDR: "0.0.0.0"
      INTERCEPTOR_UDP_PORT: "53"
      DNS_API_URL: "http://dns-api:8080"
      DNS_API_TIMEOUT_MS: "5000"
      RUST_LOG: "info"

    depends_on:
      dns-api:
        condition: service_healthy
    restart: always

  # Health Checkers en GNU C. Se levantan tres instancias con ubicaciones geograficas simuladas y
  # penalizaciones de latencia distintas: es lo que permite probar la estrategia round-trip, porque
  # cada una reporta un tiempo de respuesta diferente para la misma IP.
  # Las credenciales salen del mismo archivo que usa el DNS API.
  checker-cr:
    build:
      context: ./health_checker
      dockerfile: Dockerfile
    container_name: health-checker-cr
    env_file:
      - path: ./dns-api/.env
        required: false
    environment:
      INSTANCE_ID: "hc-cr-sjo"
      INSTANCE_COUNTRY: "CR"
      INSTANCE_CITY: "San Jose"
      INSTANCE_LAT: "9.928100"
      INSTANCE_LON: "-84.090700"
      SIMULATED_RTT_PENALTY_MS: "0.0"
      SYNC_INTERVAL_SECONDS: "30"
    restart: unless-stopped

  checker-us:
    build:
      context: ./health_checker
      dockerfile: Dockerfile
    container_name: health-checker-us
    env_file:
      - path: ./dns-api/.env
        required: false
    environment:
      INSTANCE_ID: "hc-us-nyc"
      INSTANCE_COUNTRY: "US"
      INSTANCE_CITY: "New York"
      INSTANCE_LAT: "40.712800"
      INSTANCE_LON: "-74.006000"
      SIMULATED_RTT_PENALTY_MS: "45.0"
      SYNC_INTERVAL_SECONDS: "30"
    restart: unless-stopped

  checker-eu:
    build:
      context: ./health_checker
      dockerfile: Dockerfile
    container_name: health-checker-eu
    env_file:
      - path: ./dns-api/.env
        required: false
    environment:
      INSTANCE_ID: "hc-eu-fra"
      INSTANCE_COUNTRY: "DE"
      INSTANCE_CITY: "Frankfurt"
      INSTANCE_LAT: "50.110900"
      INSTANCE_LON: "8.682100"
      SIMULATED_RTT_PENALTY_MS: "120.0"
      SYNC_INTERVAL_SECONDS: "30"
    restart: unless-stopped

  # Interfaz Web de Administración DNS (React + Vite + Nginx)
  dns-ui:
    build:
      context: ./dns-ui
      dockerfile: Dockerfile
    container_name: dns-ui
    ports:
      - "80:80"
    environment:
      VITE_API_URL: ""
    depends_on:
      dns-api:
        condition: service_healthy
    restart: always

networks:
  default:
    name: dns_stack_network
