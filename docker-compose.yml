# Orquestación del Stack DNS - T-38 (Rama Alexandra)
# Nota: Orquesta los componentes funcionales existentes en la rama Alexandra:
# 1. database (PostgreSQL + Migraciones SQL de /database/migrations)
# 2. dns-api (API REST en Java, conectada a Supabase) y su mock en Rust para pruebas aisladas
# 3. dns-interceptor (Interceptador DNS UDP/TCP en Rust)
# 4. dns-ui (Interfaz Web React + Vite servida por Nginx)
#
# PENDIENTES DE INTEGRACIÓN (Esperando Dockerfiles de compañeros):
# - dns-api (Luis / T-23): Integrado. API REST en Java con Javalin, conectada a Supabase.
# - health-checker (Otto / T-32): Pendiente entrega de Dockerfile en C.

services:
  # Base de Datos PostgreSQL con carga inicial de migraciones
  database:
    image: postgres:15-alpine
    container_name: dns-database
    restart: always
    environment:
      POSTGRES_DB: dns_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dns_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mock de la DNS API para resolver consultas mientras se entrega dns-api en Java
  mock-dns-api:
    build:
      context: ./dns-interceptor
      dockerfile: Dockerfile
    container_name: mock-dns-api
    command: ./mock_dns_api
    ports:
      - "8081:8081"
    environment:
      MOCK_API_PORT: "8081"
    restart: always

  # Engine PostgREST para exponer la base PostgreSQL local como API REST
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: postgrest
    environment:
      PGRST_DB_URI: "postgres://postgres:postgrespassword@database:5432/dns_db"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "postgres"
      PGRST_JWT_SECRET: "super-secret-jwt-secret-with-at-least-32-characters-long"

    depends_on:
      database:
        condition: service_healthy
    restart: always

  # Reverse Proxy de Supabase REST para mapear /rest/v1/ hacia PostgREST
  supabase-rest:
    image: nginx:alpine
    container_name: supabase-rest
    volumes:
      - ./supabase-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postgrest
    restart: always

  # DNS API en Java (Javalin). Expone /api/exists, /api/records y /api/dns_resolver.
  dns-api:
    build:
      context: ./dns-api
      dockerfile: Dockerfile
    container_name: dns-api
    ports:
      - "8080:8080"
    # Las credenciales de Supabase viven en dns-api/.env, que no se versiona.
    # Copiar dns-api/.env.example como dns-api/.env y completarlo antes de levantar el stack.
    env_file:
      - ./dns-api/.env
    environment:
      DNS_API_HOST: "0.0.0.0"
      DNS_API_PORT: "8080"
      DNS_API_MAX_THREADS: "100"
      # Servidor DNS remoto al que se delegan los paquetes no estandar.
      DNS_SERVER_IP: "8.8.8.8"
      DNS_SERVER_PORT: "53"
      DNS_TIMEOUT_MS: "3000"
    depends_on:
      - supabase-rest
    healthcheck:
      # wget viene incluido en la imagen base alpine, no hay que instalar nada.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Servidor Interceptador DNS UDP/TCP en Rust
  dns-interceptor:
    build:
      context: ./dns-interceptor
      dockerfile: Dockerfile
    container_name: dns-interceptor
    command: ./dns-interceptor
    ports:
      - "53:53/udp"

    environment:
      INTERCEPTOR_BIND_ADDR: "0.0.0.0"
      INTERCEPTOR_UDP_PORT: "53"
      DNS_API_URL: "http://dns-api:8080"
      DNS_API_TIMEOUT_MS: "5000"
      RUST_LOG: "info"

    depends_on:
      - dns-api
    restart: always

  # Interfaz Web de Administración DNS (React + Vite + Nginx)
  dns-ui:
    build:
      context: ./dns-ui
      dockerfile: Dockerfile
    container_name: dns-ui
    ports:
      - "80:80"
    environment:
      VITE_API_URL: ""
    depends_on:
      - dns-api
    restart: always

networks:
  default:
    name: dns_stack_network
