[package]
name = "dns-interceptor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Runtime async: permite atender múltiples paquetes UDP en paralelo.
tokio = { version = "1", features = ["full"] }
# Logging estructurado, útil para depurar paquetes DNS crudos durante las pruebas.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
