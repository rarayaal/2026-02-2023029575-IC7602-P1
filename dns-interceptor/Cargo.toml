[package]
name = "dns-interceptor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dns-interceptor"
path = "src/main.rs"

[[bin]]
name = "mock_dns_api"
path = "src/bin/mock_dns_api.rs"


[dependencies]
# runtime asinc para multiples peticiones UDP concurrentes
tokio = { version = "1", features = ["full"] }

# Cliente HTTPS para delegar paquetes no estándar al DNS API (rustls = TLS puro Rust, no requiere OpenSSL del sistema).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# (De)serialización del body JSON asumido para /api/dns_resolver.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Codificación BASE64 del paquete DNS intercambiado con el DNS API.
base64 = "0.22"

# para el random (usado por P2 para estrategias)
rand = "0.8"

# para el logging estructurado en consola
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
